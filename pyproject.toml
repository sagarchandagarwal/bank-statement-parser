[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-bank-statement-parser"
version = "0.1.0"
description = "Parse Indian bank PDF statements (HDFC, SBI, Yes Bank, RBL, IndusInd, One, Standard Chartered) into structured transaction data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["bank", "statement", "pdf", "parser", "india", "transactions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Text Processing :: Filters",
]
dependencies = [
    "pdfplumber>=0.10.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1.0"]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/birr/bank-statement-parser"
Issues = "https://github.com/birr/bank-statement-parser/issues"

[tool.setuptools.packages.find]
include = ["bank_statement_parser*"]
exclude = ["uploads*", "outputs*", "templates*"]

[tool.setuptools.package-data]
bank_statement_parser = ["py.typed"]
